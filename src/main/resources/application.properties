# Database Configuration
# db.url is built dynamically from IOTBAY_DB_PATH env var (see AppConfig / DBConnection)
# Fallback path used when env var is not set (relative to working directory)
db.path=./iotbay.db
db.driver=org.sqlite.JDBC

# Security Configuration
security.session.timeout=30
security.password.min.length=8
security.max.login.attempts=5

# Application Configuration
app.name=IoTBay
app.version=1.0.0
app.environment=development
